{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monoliet Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="flex-center" style="min-height: 100vh; padding: 1.5rem;">
    <div style="width: 100%; max-width: 28rem;">
        <div class="text-center mb-6">
            <h1 class="mb-2">MONOLIET</h1>
            <p class="label">Client Portal Access</p>
        </div>

        <div class="glass-card glass-card--flat">
            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                <div class="alert alert--error mb-4">
                    AUTHENTICATION FAILED
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" id="id_username" required class="form-input">
                </div>

                <div class="form-group">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" id="id_password" required class="form-input">
                </div>

                <button type="submit" class="btn btn-primary w-full">AUTHENTICATE</button>
            </form>
        </div>

        <div class="text-center mt-4">
            <p class="label">SECURE PORTAL ACCESS</p>
        </div>
    </div>
</body>
</html>
